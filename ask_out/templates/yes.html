{% extends "base.html" %}
{% block title %}Yay! 💖{% endblock %}
{% block content %}
  <div class="emoji big">🥰</div>
  <h1>Yay! You said yes!</h1>
  <p class="kicker">Let's make a plan, {{ name }}.</p>

  <form class="plan" method="post" action="{{ url_for('plan') }}">
    <input type="hidden" name="name" value="{{ name }}">

    <fieldset>
      <legend>What should we do?</legend>
      <div class="ideas">
        {% for key, label in ideas %}
        <label class="idea">
          <input type="radio" name="idea" value="{{ key }}" {% if loop.first %}checked{% endif %}>
          <span>{{ label }}</span>
        </label>
        {% endfor %}
      </div>
    </fieldset>

    <div class="row">
      <label>When?
        <input type="date" name="date" id="dateInput" required>
      </label>
      <label>What time?
        <input type="time" name="time" value="18:00" required>
      </label>
    </div>

    <label>Anything else? <span class="muted">(optional)</span>
      <textarea name="note" rows="3" maxlength="500" placeholder="I'm allergic to cats, I love pasta…"></textarea>
    </label>

    <button class="btn yes wide" type="submit">It's a date! 🗓️</button>
  </form>
{% endblock %}
{% block scripts %}
<script>confetti(); initPlanForm();</script>
{% endblock %}
